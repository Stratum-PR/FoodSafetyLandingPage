# Keeps data/fda-es.json (Spanish names for FDA recall products on Alertas PR) up to date.
# Runs every Monday and on demand (Actions → "Translate FDA product names" → Run workflow).
# Needs the repository secret ANTHROPIC_API_KEY. A changed file is committed to main, which
# deploys the site with the new names.
name: Translate FDA product names

on:
  schedule:
    - cron: "41 10 * * 1" # Mondays, 6:41 a.m. in Puerto Rico
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: translate-fda
  cancel-in-progress: false

jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install the Anthropic SDK
        working-directory: scripts/translate
        run: npm ci --no-audit --no-fund
      - name: Translate new product names
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/translate/translate-fda.mjs
      - name: Commit the names
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/fda-es.json
          if git diff --cached --quiet; then echo "No new names."; exit 0; fi
          git commit -m "Alertas PR: update Spanish names for FDA products"
          git push
